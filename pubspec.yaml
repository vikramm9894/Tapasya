name: tapasya
description: "Tapasya - 90-day consistency app. Roz thoda. 90 din tak."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Persistence & Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Navigation & Deep Linking
  go_router: ^14.1.4

  # UI, Charts & Styling
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Notifications & Background Services
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3
  workmanager: ^0.5.2

  # Widgets & System Integration
  home_widget: ^0.6.0
  local_auth: ^2.2.0
  share_plus: ^9.0.0
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  test: ^1.25.2

flutter:
  uses-material-design: true
