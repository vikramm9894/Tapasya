name: Build Tapasya Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          java -version
          flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Drift Database Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android Debug APK
        run: flutter build apk --debug -v

      - name: Build Android Release APK
        run: flutter build apk --release --no-shrink -v

      - name: Copy & Rename APKs
        run: |
          mkdir -p output_apk
          cp build/app/outputs/flutter-apk/app-debug.apk output_apk/Tapasya-debug.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk output_apk/Tapasya-release.apk || true
          ls -lh output_apk/

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tapasya-Android-APK
          path: output_apk/*.apk
          retention-days: 30

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: Tapasya v1.0.0 Android APK Build
          body: |
            ### ॐ Tapasya (तपस्या) — 90-Day Consistency App
            **Android APK Build**

            Download and install on your Android device:
            - **`Tapasya-debug.apk`** (Ready to install on any Android phone without signature checks)
            - **`Tapasya-release.apk`** (Optimized release build)

            **Features Included:**
            - 90-Day Journey Matrix & Non-Negotiables Engine
            - AI Coach (Rule-Based Offline & Why-Aware)
            - Focus Pomodoro Timer & Exam Mode Velocity
            - Boss Battles & Mini Challenges
            - Biometric App Lock & Zero-Cloud Privacy
          files: output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
