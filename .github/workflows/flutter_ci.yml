name: Tapasya CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test_and_analyze:
    name: Flutter Lint & Pure Engine Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Generate Code (Drift Database)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Code Quality
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos > analyze.log 2>&1 || {
            echo "### Flutter Analyze Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze.log
            exit 1
          }

      - name: Run Pure Domain Engine & AI Tests
        run: flutter test test/engines/ test/ai/

      - name: Push Analyze Logs on Failure
        if: failure()
        run: |
          git config --global user.name "Vikram Nishad"
          git config --global user.email "vikramnishad9894@gmail.com"
          git checkout --orphan analyze-logs
          git rm -rf . || true
          mkdir -p logs
          cp analyze.log logs/ 2>/dev/null || true
          echo "Analyze failed at $(date)" > logs/failed_at.txt
          git add logs/
          git commit -m "chore: upload analyze diagnostic logs"
          git push -f origin analyze-logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
